name: owncloud

# Set OWNCLOUD_ADMIN_PASSWORD (12+ characters) in a .env file next to this one, or the password of the first
# account ("admin") is generated on first start: docker compose exec control-plane cat /data/admin-password.txt
# OWNCLOUD_ALLOW_SIGNUP=false turns off self-service sign-up (admins then create accounts).

services:
  # ==============================================================================
  # 1. In-Memory Distributed Cache (Redis)
  # ==============================================================================
  redis:
    image: redis:alpine
    container_name: hackathon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hackathon-network

  # ==============================================================================
  # 2. Intelligent Cache Manager (FastAPI + Redis Planner & Self-Critic)
  # ==============================================================================
  cache-service:
    build:
      context: ./CacheManager
      dockerfile: Dockerfile
    container_name: hackathon-cache-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - CACHE_REDIS_HOST=redis
      - CACHE_REDIS_PORT=6379
      - CACHE_PREDICTIONS_FILE=/app/data/predictions.json
      - CACHE_WATCHER_POLL_SECONDS=10
      - CACHE_WARM_CHECK_INTERVAL_SECONDS=30
      - CACHE_LOG_LEVEL=INFO
    volumes:
      - ./CacheManager/data:/app/data
    depends_on:
      - redis
    networks:
      - hackathon-network

  # ==============================================================================
  # 3. AI Cloud Honeypot Shield & Forensic Evidence Vault
  # ==============================================================================
  cloud-honeypot:
    build:
      context: ./cloud_honeypot_ai
      dockerfile: Dockerfile
    container_name: hackathon-cloud-honeypot
    restart: unless-stopped
    ports:
      - "8888:8888"   # Web Dashboard (Threat Intelligence & Attack Replay)
      - "2222:2222"   # Fake SSH Decoy
      - "8080:8080"   # Fake HTTP Web Decoy
      - "2323:2323"   # Fake TCP/Telnet Decoy
    environment:
      - HONEYPOT_HOST=0.0.0.0
      - HONEYPOT_HOSTNAME=ip-10-0-1-42.ec2.internal
    volumes:
      - ./cloud_honeypot_ai/data:/app/cloud_honeypot_ai/data
    networks:
      - hackathon-network

  # ==============================================================================
  # 4. Frontend Dashboard (React + Vite + Tailwind)
  # ==============================================================================
  frontend:
    build:
      context: ./QuantumTrace/web
      dockerfile: Dockerfile
    container_name: hackathon-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_HONEYPOT_URL=http://localhost:8888
    networks:
      - hackathon-network
    profiles:
      - frontend
      - full

  # ==============================================================================
  # 5. OwnCloud: QuantumTrace, control plane and website/console (:8088)
  # ==============================================================================
  # QuantumTrace: post-quantum cryptography analysis. Internal only: not published on the host.
  quantumtrace:
    build: ./QuantumTrace
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Control plane: upload → analysis → build → run, as Docker containers on this host.
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    depends_on:
      - quantumtrace
    environment:
      QUANTUMTRACE_URL: http://quantumtrace:8000
      # Hosted apps are linked on 127.0.0.1 so they are a different site from the console (localhost).
      OWNCLOUD_PUBLIC_HOST: 127.0.0.1
      OWNCLOUD_ALLOW_SIGNUP: ${OWNCLOUD_ALLOW_SIGNUP:-true}
      OWNCLOUD_BIND_HOST: 127.0.0.1
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD:-}
      OWNCLOUD_TRUST_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - owncloud-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Not published on the host: reachable only through the web proxy.

  # Website and console, with /api proxied to the control plane.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - control-plane
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8088:80"

volumes:
  redis_data:
  owncloud-data:

networks:
  hackathon-network:
    driver: bridge
