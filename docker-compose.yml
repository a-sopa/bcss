name: owncloud

# Set OWNCLOUD_ADMIN_PASSWORD (12+ characters) in a .env file next to this one, or a password is generated
# on first start: docker compose exec control-plane cat /data/admin-password.txt

services:
  # QuantumTrace: post-quantum cryptography analysis. Internal only: not published on the host.
  quantumtrace:
    build: ./JunctionX
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Control plane: upload → analysis → build → run, as Docker containers on this host.
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    depends_on:
      - quantumtrace
    environment:
      QUANTUMTRACE_URL: http://quantumtrace:8000
      OWNCLOUD_PUBLIC_HOST: localhost
      OWNCLOUD_BIND_HOST: 127.0.0.1
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD:-}
      OWNCLOUD_TRUST_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - owncloud-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Not published on the host: reachable only through the web proxy.

  # Website and console, with /api proxied to the control plane.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - control-plane
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8088:80"

volumes:
  owncloud-data:
