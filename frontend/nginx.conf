limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Requests for any other host name (e.g. DNS rebinding) are dropped at the edge.
server {
    listen 80 default_server;
    server_tokens off;
    return 444;
}

# The console only runs on "localhost": hosted apps use 127.0.0.1, so they are a different site and cannot
# set or receive the console's cookies. Visits to 127.0.0.1 are redirected to localhost (same port).
map $http_host $console_port {
    "~:(?<port>[0-9]+)$" ":$port";
    default "";
}

server {
    listen 80;
    server_name 127.0.0.1;
    server_tokens off;
    location / {
        return 301 http://localhost$console_port$request_uri;
    }
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 60m;

    # Monaco needs inline <style> elements; scripts, workers and fonts are all served from this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        # The API sets its own (stricter) security headers; avoid duplicates such as "DENY, DENY".
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        limit_req_status 429;
        proxy_pass http://control-plane:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        # The API sets its own (stricter) security headers; avoid duplicates such as "DENY, DENY".
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        limit_req_status 429;
        proxy_pass http://control-plane:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Never serve dotfiles (e.g. .git, .env) if any end up in the build.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
